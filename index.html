
<!DOCTYPE html>
<html>
<head>
    <title>My Home Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f6fc;
        }

        header {
            background-color: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        nav a:hover {
            color: yellow;
        }

        .home {
            text-align: center;
            padding: 80px 20px;
        }

        .home h2 {
            color: #1e3a8a;
            font-size: 35px;
        }

        .home p {
            font-size: 18px;
        }

        button {
            background-color: #1e3a8a;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to My Home Page</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <section class="home">
        <h2>Welcome to My Website</h2>
        <p>This is my first webpage created using HTML and CSS.</p>
        <p>Learn, Explore and Grow with Us!</p>

        <button>Get Started</button>
    </section>

    <footer>
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
